[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-travel-itinerary"
version = "1.0.0"
description = "Offline-first constraint-aware travel itinerary and visual prompt generator"
requires-python = ">=3.10"
dependencies = ["streamlit>=1.40,<2", "python-dotenv>=1.0,<2"]

[project.scripts]
atlas-plan = "travel_itinerary.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
